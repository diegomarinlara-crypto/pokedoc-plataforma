<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PokéDoc: Plataforma Niño Sano y Puerperio</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    body { background-color: #212529; color: #000; font-family: 'Press Start 2P', monospace; padding: 20px; display: flex; justify-content: center; }
    .pokedex { background-color: #dc2626; border: 8px solid #991b1b; border-radius: 16px; width: 850px; padding: 20px; box-shadow: 0 10px 0 #7f1d1d; }
    .screen { background-color: #f1f5f9; border: 5px solid #0f172a; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .title { color: #fff; text-shadow: 2px 2px #000; text-align: center; margin-bottom: 15px; font-size: 14px; }
    .btn { background-color: #facc15; border: 3px solid #000; padding: 8px 12px; font-family: 'Press Start 2P', monospace; font-size: 10px; cursor: pointer; margin-right: 5px; }
    .btn:hover { background-color: #eab308; }
    .dialog { background-color: #fff; border: 3px solid #000; padding: 10px; margin-top: 10px; font-size: 10px; line-height: 1.5; }
    textarea { width: 95%; height: 90px; font-family: monospace; border: 2px solid #000; margin-top: 5px; }
  </style>
</head>
<body>

<div class="pokedex">
  <h1 class="title">CENTRO MÉDICO POKÉ-DOC: CONTROL CLÍNICO</h1>

  <div class="screen">
    <button class="btn" onclick="setModo('nino')">Niño Sano (OMS)</button>
    <button class="btn" onclick="setModo('puerperio')">Puerperio (GuíaSalud)</button>
  </div>

  <div class="screen" id="dynamic-content">
    <p style="font-size: 10px;">Selecciona una opción arriba para iniciar la consulta...</p>
  </div>

  <div class="screen">
    <h4 style="font-size: 10px; margin: 0 0 5px 0;">NOTA MÉDICA AUTOMÁTICA</h4>
    <textarea id="txtNota" placeholder="Aquí se generará la nota clínica..."></textarea>
  </div>
</div>

<script>
function setModo(modo) {
  const content = document.getElementById('dynamic-content');
  if (modo === 'nino') {
    content.innerHTML = `
      <h3 style="font-size:11px;">CONTROL DE NIÑO SANO</h3>
      <label style="font-size:9px;">Selecciona Edad:</label>
      <select id="selEdad" onchange="actualizarNino()" style="font-family:'Press Start 2P'; font-size:9px;">
        <option value="rn">Recién Nacido (0-28d)</option>
        <option value="2m">2 Meses</option>
        <option value="6m">6 Meses</option>
      </select>
      <div class="dialog" id="boxPreguntas"></div>
      <br>
      <label style="font-size:9px;">Percentil OMS (Peso/Edad):</label>
      <input type="number" id="numPerc" style="width:60px;" onchange="evaluarPerc()">
      <div id="boxStatus" style="margin-top:5px; font-size:9px;"></div>
    `;
    actualizarNino();
  } else {
    content.innerHTML = `
      <h3 style="font-size:11px;">CONTROL DE PUERPERIO</h3>
      <label style="font-size:9px;">Etapa:</label>
      <select id="selPuerp" onchange="actualizarPuerp()" style="font-family:'Press Start 2P'; font-size:9px;">
        <option value="m1">Mes 1 (Inmediato/Tardío)</option>
        <option value="m2">Mes 2 a 6 (Alejado)</option>
      </select>
      <div class="dialog" id="boxPuerp"></div>
    `;
    actualizarPuerp();
  }
}

function actualizarNino() {
  const v = document.getElementById('selEdad').value;
  const box = document.getElementById('boxPreguntas');
  const txt = document.getElementById('txtNota');
  if(v==='rn') {
    box.innerHTML = "<b>Preguntas:</b><br>• ¿Lactancia materna o fórmula?<br>• ¿>6 micciones/día?<br>• ¿Cordón umbilical limpio y seco?";
    txt.value = "SUBJETIVO: Recién nacido en control. Adecuada alimentación y diuresis conservada.\nOBJETIVO: Reflejo rojo (+), Barlow/Ortolani (-).\nPLAN: Continuar LME y vacunas.";
  } else if(v==='2m') {
    box.innerHTML = "<b>Preguntas:</b><br>• ¿Sonrisa social presente?<br>• ¿Sigue objetos?<br>• ¿Sostén cefálico?";
    txt.value = "SUBJETIVO: Lactante de 2 meses. Sin irritabilidad.\nOBJETIVO: Sostén cefálico presente, fija mirada.\nPLAN: Esquema de vacunación del 2do mes.";
  }
}

function evaluarPerc() {
  const p = parseFloat(document.getElementById('numPerc').value);
  const st = document.getElementById('boxStatus');
  if(p > 97) {
    st.innerHTML = "<span style='color:red;'>¡ALERTA SNORLAX! Percentil > 97 (Sobrepeso/Obesidad). Reevaluar dieta.</span>";
  } else if(p < 3) {
    st.innerHTML = "<span style='color:blue;'>¡ALERTA DEBILITADO! Percentil < 3. Descartar bajo aporte.</span>";
  } else {
    st.innerHTML = "<span style='color:green;'>STATUS OK: Percentil en rango normal.</span>";
  }
}

function actualizarPuerp() {
  const v = document.getElementById('selPuerp').value;
  const box = document.getElementById('boxPuerp');
  const txt = document.getElementById('txtNota');
  if(v==='m1') {
    box.innerHTML = "<b>Preguntas:</b><br>• ¿Loquios de mal olor?<br>• ¿Dolor/grietas en pezones?<br>• ¿Anhedonia/tristeza?<br><br><b>Paso a paso:</b> Si sangrado fétido o fiebre -> descartar endometritis/mastitis.";
    txt.value = "SUBJETIVO: Puérpera mes 1. Sin fiebre ni sangrado patológico.\nOBJETIVO: Útero involucionado, mamas sin mastitis.\nPLAN: Lactancia y anticoncepción.";
  } else {
    box.innerHTML = "<b>Preguntas:</b><br>• ¿Método anticonceptivo?<br>• ¿Recuperación de piso pélvico?";
    txt.value = "SUBJETIVO: Puérpera control alejado.\nPLAN: Continuar anticoncepción y seguimiento ginecológico.";
  }
}
</script>

</body>
</html>
